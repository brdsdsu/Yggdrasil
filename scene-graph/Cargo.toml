[package]
# Published to crates.io as `yggdrasil-3d`; the directory keeps its old name. Workspace
# crates depend on it under the key `scene-graph`, so their code still reads
# `scene_graph::`. Everyone else, including this crate's own doctests, examples and
# benches, imports it by its lib name: `yggdrasil::`.
name = "yggdrasil-3d"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "A layered 3D scene graph for autonomous systems, with spatial, semantic and field-of-view queries"
readme = "../README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["scene-graph", "3d", "robotics", "spatial", "kd-tree"]
categories = ["data-structures", "science::robotics"]

[lib]
name = "yggdrasil"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[bench]]
name = "visible_subgraph"
harness = false

[dependencies]
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
# Vendored fork of kiddo. Its lib keeps upstream's `kiddo` name so upstream's own tests and
# doctests compile unmodified, so it is renamed here instead — code that reads
# `spatial_index::` is code that gets this workspace's adaptive split policy, not crates.io
# kiddo's depth-cycled one.
spatial_index = { package = "yggdrasil-3d-spatial-index", path = "../spatial-index", version = "0.1.1" }
thiserror = "2.0.17"

[dev-dependencies]
criterion = "0.8.2"
# `test_utils` carries the RegionMembershipPredicate conformance harness.
spatial_index = { package = "yggdrasil-3d-spatial-index", path = "../spatial-index", version = "0.1.1", features = ["test_utils"] }
rand = "0.10.1"
