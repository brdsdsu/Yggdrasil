[package]
name = "scene-graph"
version = "0.1.0"
edition = "2024"

[[example]]
name = "demo"
path = "examples/demo.rs"

[dependencies]
glam = { version = "0.30.9", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
# Vendored fork of kiddo. Its lib keeps upstream's `kiddo` name so upstream's own tests and
# doctests compile unmodified, so it is renamed here instead — code that reads
# `spatial_index::` is code that gets this workspace's adaptive split policy, not crates.io
# kiddo's depth-cycled one.
spatial_index = { package = "spatial-index", path = "../spatial-index" }
thiserror = "2.0.17"

[dev-dependencies]
rand = "0.10.1"
