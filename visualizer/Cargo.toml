[package]
name = "visualizer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "visualizer"
path = "src/main.rs"

[lib]
name = "visualizer"
path = "src/lib.rs"

[dependencies]
scene-graph = { path = "../scene-graph" }
bevy        = { version = "0.15", default-features = true }
bevy_egui   = "0.31"
bevy_panorbit_camera = "0.22"
clap        = { version = "4", features = ["derive"] }
serde_json  = "1"
rand        = "0.9"
