[package]
# Published to crates.io as `yggdrasil-3d-viz`; the directory keeps its old name, and so does
# the library (`viz`), which only exists to share code between the binary and its tests.
name = "yggdrasil-3d-viz"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Interactive 3D visualizer for Yggdrasil scene graphs"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["scene-graph", "visualization", "bevy", "3d", "robotics"]
categories = ["visualization", "science::robotics", "command-line-utilities"]
include = ["/Cargo.toml", "/README.md", "/src/**"]

[[bin]]
name = "yggdrasil-3d-viz"
path = "src/main.rs"

[lib]
name = "viz"
path = "src/lib.rs"

[dependencies]
scene-graph = { package = "yggdrasil-3d", path = "../scene-graph", version = "0.1.1" }
bevy = { version = "0.15", features = ["wayland"] }
bevy_egui   = "0.31"
bevy_panorbit_camera = "0.22"
clap        = { version = "4", features = ["derive"] }
serde_json  = "1"
# Capture writes the PNG itself rather than using bevy's `save_to_disk` observer, so a
# failure reaches the panel instead of only the log. Same crate and version bevy_image
# pulls in, so `Image::try_into_dynamic` hands back a `DynamicImage` of this type.
image       = { version = "0.25", default-features = false, features = ["png"] }
rand        = "0.10"


[dev-dependencies]
# allows fast iteration during development
bevy = { version = "0.15", features = ["dynamic_linking"] }

