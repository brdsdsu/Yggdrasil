[package]
name = "scene-graph"
version = "0.1.0"
edition = "2024"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[bench]]
name = "visible_subgraph"
harness = false

[dependencies]
glam = { version = "0.30.9", features = ["serde"] }
kiddo = "5.2.3"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.1"
