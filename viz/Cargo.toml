[package]
name = "viz"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "viz"
path = "src/main.rs"

[lib]
name = "viz"
path = "src/lib.rs"

[dependencies]
scene-graph = { path = "../scene-graph" }
bevy = { version = "0.15", features = ["wayland"] }
bevy_egui   = "0.31"
bevy_panorbit_camera = "0.22"
clap        = { version = "4", features = ["derive"] }
serde_json  = "1"
# Capture writes the PNG itself rather than using bevy's `save_to_disk` observer, so a
# failure reaches the panel instead of only the log. Same crate and version bevy_image
# pulls in, so `Image::try_into_dynamic` hands back a `DynamicImage` of this type.
image       = { version = "0.25", default-features = false, features = ["png"] }
rand        = "0.10"


[dev-dependencies]
# allows fast iteration during development
bevy = { version = "0.15", features = ["dynamic_linking"] }

